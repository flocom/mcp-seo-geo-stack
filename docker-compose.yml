# mcp-seo-geo-stack : connecteur Claude privé (Search Console + Bing Webmaster + GA4)
# publié via un tunnel Cloudflare. Aucun port n'est ouvert sur le serveur.
#
#   docker compose up -d            # construit les images arm64 localement si besoin
#   docker compose pull && docker compose up -d   # avec IMAGE_PREFIX=ghcr.io/flocom/mcp-seo-geo-stack
#
# Ensuite, le service « updater » applique seul chaque nouvelle version de la branche suivie
# (git pull, build ou pull des images, docker compose up -d). Voir README, « Automatic updates ».
name: mcp-seo-geo-stack

x-service: &service
  platform: linux/arm64
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  networks: [mcp]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  setup:
    <<: *service
    build:
      context: .
      dockerfile: services/setup/Dockerfile
      platforms: [linux/arm64]
    image: ${IMAGE_PREFIX:-mcp-seo-geo-stack}/setup:${IMAGE_TAG:-latest}
    environment: &access
      # Vérification des jetons Cloudflare Access (voir .env.example). Sans ces deux
      # valeurs, setup et gate refusent tout.
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
    volumes:
      - seo-data:/data

  # Seule porte d'entrée vers les serveurs MCP : le tunnel envoie /gsc-bing/ et /ga4/ ici.
  gate:
    <<: *service
    build:
      context: .
      dockerfile: services/gate/Dockerfile
      platforms: [linux/arm64]
    image: ${IMAGE_PREFIX:-mcp-seo-geo-stack}/gate:${IMAGE_TAG:-latest}
    environment:
      <<: *access
      # Sessions MCP ouvertes au plus par serveur MCP (la plus ancienne inactive est fermée au-delà).
      GATE_MAX_SESSIONS: ${GATE_MAX_SESSIONS:-100}
    volumes:
      - seo-data:/data:ro
    networks: [mcp, backend]

  gsc-bing:
    <<: *service
    build:
      context: .
      dockerfile: services/gsc-bing/Dockerfile
      platforms: [linux/arm64]
    image: ${IMAGE_PREFIX:-mcp-seo-geo-stack}/gsc-bing:${IMAGE_TAG:-latest}
    # Plafond mémoire : un pic de sessions ne tue que des processus de ce conteneur, jamais
    # cloudflared ni le serveur (sinon : erreur Cloudflare 1033, tunnel injoignable).
    mem_limit: ${MCP_MEM_LIMIT:-1536m}
    pids_limit: 512
    environment: &mux
      # Processus serveur MCP partagés par toutes les sessions (voir services/mux/mux.mjs).
      MUX_BACKENDS: ${MUX_BACKENDS:-2}
      MUX_MAX_SESSIONS: ${MUX_MAX_SESSIONS:-200}
      MUX_SESSION_IDLE_MS: ${MUX_SESSION_IDLE_MS:-1800000}
      MUX_REQUEST_TIMEOUT_MS: ${MUX_REQUEST_TIMEOUT_MS:-300000}
      MUX_DEBUG: ${MUX_DEBUG:-0}
    volumes:
      - seo-data:/data:ro
    depends_on: [setup]
    # Pas sur le réseau du tunnel : joignable uniquement par gate.
    networks: [backend]

  ga4:
    <<: *service
    build:
      context: .
      dockerfile: services/ga4/Dockerfile
      platforms: [linux/arm64]
    image: ${IMAGE_PREFIX:-mcp-seo-geo-stack}/ga4:${IMAGE_TAG:-latest}
    # Plafond mémoire : un pic de sessions ne tue que des processus de ce conteneur, jamais
    # cloudflared ni le serveur (sinon : erreur Cloudflare 1033, tunnel injoignable).
    mem_limit: ${MCP_MEM_LIMIT:-1536m}
    pids_limit: 512
    environment: *mux
    volumes:
      - seo-data:/data:ro
    depends_on: [setup]
    # Pas sur le réseau du tunnel : joignable uniquement par gate.
    networks: [backend]

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared:2026.11.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Renseignez CLOUDFLARE_TUNNEL_TOKEN dans .env}
    depends_on:
      setup:
        condition: service_healthy

  updater:
    <<: *service
    build:
      context: .
      dockerfile: services/updater/Dockerfile
      platforms: [linux/arm64]
    image: ${IMAGE_PREFIX:-mcp-seo-geo-stack}/updater:${IMAGE_TAG:-latest}
    # su-exec : git tourne avec l'uid du propriétaire du dépôt.
    cap_add: [SETUID, SETGID]
    environment:
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      DOCKER_CONFIG: /tmp/.docker
    volumes:
      # Accès au démon Docker : nécessaire pour redéployer la stack (équivalent root sur l'hôte).
      - /var/run/docker.sock:/var/run/docker.sock
      # Le dépôt cloné sur le serveur (git fetch + fast-forward).
      - .:/repo
    # Réseau à part : accès sortant pour git, aucun accès aux services MCP.
    networks: [updater]

networks:
  # cloudflared, setup, gate.
  mcp:
    driver: bridge
  # gate et serveurs MCP (accès sortant vers les API Google et Bing).
  backend:
    driver: bridge
  updater:
    driver: bridge

volumes:
  # Client OAuth Google, refresh token, clé Bing. Jamais dans git ni dans les images.
  seo-data:
