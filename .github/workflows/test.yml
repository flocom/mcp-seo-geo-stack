# Lint, unit tests (OAuth flow against a mock Google) and full Docker
# end-to-end test on a native arm64 runner.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck services/common/entrypoint.sh services/updater/updater.sh tests/e2e.sh tests/updater-e2e.sh
      - name: hadolint
        run: |
          for f in services/*/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.12.0 < "$f"
            echo "::endgroup::"
          done
      - name: Python syntax
        run: python3 -m py_compile services/common/access_jwt.py services/setup/app.py services/gate/gate.py tests/access_token.py tests/test_setup_flow.py tests/test_gate.py
      - name: Node syntax
        run: node --check tests/mcp-smoke.mjs
      - name: Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json

  setup-flow:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: google-auth (to check the generated credentials file)
        run: pip install "google-auth~=2.62"
      - name: OAuth flow and Cloudflare Access JWT checks against mocks
        run: python tests/test_setup_flow.py
      - name: Gate in front of the MCP servers (Access JWT, streaming)
        run: python tests/test_gate.py

  e2e:
    runs-on: ubuntu-24.04-arm
    needs: [lint, setup-flow]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Full stack (Docker, arm64)
        run: bash tests/e2e.sh
      - name: Automatic updates (updater service)
        run: bash tests/updater-e2e.sh
      - name: Container logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: |
            e2e-logs.txt
            updater-e2e-logs.txt

  # Same updater test with Docker's containerd image store (default on new Docker installs),
  # where image IDs and pruning behave differently from the classic overlay2 store.
  updater-containerd:
    runs-on: ubuntu-24.04-arm
    needs: [lint, setup-flow]
    steps:
      - uses: actions/checkout@v5
      - name: Enable the containerd image store
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}'
      - name: Automatic updates (updater service, containerd store)
        run: bash tests/updater-e2e.sh
      - name: Container logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: updater-containerd-logs
          path: updater-e2e-logs.txt
